<div class="card-package">
  <div class="relative">
    <img [src]="package.image" [alt]="package.title" class="w-full h-48 object-cover" />
    <div class="absolute top-4 left-4 flex gap-2">
      <span class="bg-brand-primary text-white px-2 py-1 rounded text-sm">{{package.days}}</span>
      <span class="bg-brand-secondary text-white px-2 py-1 rounded text-sm">{{package.regime}}</span>
    </div>
  </div>
  <div class="p-6">
    <h3 class="text-xl font-bold text-brand-neutral-900 mb-2">{{package.title}}</h3>
    <p class="text-gray-600 mb-4">{{package.description}}</p>
    <div class="space-y-2 mb-4">
      @for (feature of package.features; track feature) {
        <div class="flex items-center gap-2">
          <lucide-icon [img]="CheckCircle" class="h-4 w-4 text-brand-primary"></lucide-icon>
          <span class="text-sm text-gray-600">{{feature}}</span>
        </div>
      }
    </div>
    <div class="mb-4">
      <p class="text-2xl font-bold text-brand-accent">{{package.price}}</p>
    </div>
    <app-button variant="secondary" [fullWidth]="true" (clicked)="onRequestItinerary()">
      Quero meu planejamento
    </app-button>
  </div>
</div>
