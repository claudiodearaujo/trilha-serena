<section id="contato" class="py-16 bg-white">
  <div class="container mx-auto px-4">
    <div class="max-w-4xl mx-auto">
      <div class="text-center mb-12">
        <h2 class="text-3xl font-bold text-brand-neutral-900 mb-4">
          Entre em Contato
        </h2>
        <p class="text-lg text-gray-600">
          Pronto para sua próxima aventura? Vamos planejar juntos!
        </p>
      </div>
      <div class="grid md:grid-cols-2 gap-12">
        <div>
          <h3 class="text-xl font-semibold text-brand-neutral-900 mb-6">
            Fale Conosco
          </h3>
          <div class="space-y-4">
            <div class="flex items-center gap-3">
              <lucide-icon [img]="Phone" class="h-5 w-5 text-brand-primary"></lucide-icon>
              <div>
                <p class="font-medium">WhatsApp</p>
                <p class="text-gray-600">Respondemos em até 2 min (horário comercial)</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <lucide-icon [img]="Mail" class="h-5 w-5 text-brand-primary"></lucide-icon>
              <div>
                <p class="font-medium">E-mail</p>
                <p class="text-gray-600">contato@trilhaserena.com.br</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <lucide-icon [img]="MapPin" class="h-5 w-5 text-brand-primary"></lucide-icon>
              <div>
                <p class="font-medium">Atendimento</p>
                <p class="text-gray-600">100% digital, em todo o Brasil</p>
              </div>
            </div>
          </div>
        </div>
        <div>
          <form (ngSubmit)="handleSubmit()" class="space-y-4">
            <div class="form-field">
              <label for="name" class="form-label">Nome completo</label>
              <input
                id="name"
                name="name"
                type="text"
                [(ngModel)]="formData.name"
                class="form-input"
                required
              />
            </div>
            <div class="form-field">
              <label for="email" class="form-label">E-mail</label>
              <input
                id="email"
                name="email"
                type="email"
                [(ngModel)]="formData.email"
                class="form-input"
                required
              />
            </div>
            <div class="form-field">
              <label for="phone" class="form-label">Telefone/WhatsApp</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                [(ngModel)]="formData.phone"
                class="form-input"
                required
              />
            </div>
            <div class="form-field">
              <label for="message" class="form-label">Mensagem</label>
              <textarea
                id="message"
                name="message"
                [(ngModel)]="formData.message"
                class="form-input"
                rows="4"
                placeholder="Conte-nos sobre sua viagem dos sonhos..."
                required
              ></textarea>
            </div>
            <app-button type="submit" variant="primary" [fullWidth]="true">
              Enviar mensagem
            </app-button>
            <p class="text-sm text-gray-500 text-center">
              Leva 2 minutos. Sem compromisso.
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
